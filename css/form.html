<html lang="en">
    <head>
        <title>Class 4</title>
        <link rel="stylesheet" href="forms.css">
    </head>

<body>

    <h1>NU Student Registration</h1>

    <form>

       <label for="full_name">Full Name</label> 
       <input type="text" placeholder="Enter your full name" value="Abdul Rafay" id="full_name"/>
       <br> 
       <label for="email">Email</label>
       <input type="email" placeholder="Enter your email" id="email" required/>
        <br>
        <label">Male</label><input type="radio" value="Male" name="gender"/>
        <label>Female</label><input type="radio" value="Female"name="gender"/>
        
        <div>
            <h3>Select Courses</h3>
            <label for="html">HTML</label>
            <input type="checkbox" value="html" id="html" name="courses[]"/>
            <label for="css">CSS</label>
            <input type="checkbox" value="html" id="css" name="courses[]"/>
            <label for="java">JAVA</label>
            <input type="checkbox" value="html" id="java" name="courses[]"/>
        </div>
        
        <div>
            <label for="date">Date</label>
            <input type="date" id="date" name="date"/>
        </div>    
        <div>
            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="Enter your address"/>
        </div>
        <div>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"/>
        </div>
        <div>
            <label for="semester">Semester</label>
            <select id="semester" name="semester">
                <option value="">Select Semester</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
            </select>
        </div>
        <div>
            <label for="comments">Comments</label>
            <textarea id="comments" name="comments" rows="3" placeholder="Any comments"></textarea>
        </div>
        <div>
            <button type="submit">Register</button>
            <button type="reset">Reset</button>
        </div>
        <div>
            <label>Age</label>
            <input type="number" name="age" min="18" max="24" disabled/>
        </div>    
            
        
        <div>
            <label>Passport picture</label>
            <input type="file" name="passport" accept="image/*" />
        </div>    
                    
        <div>
            <label for="country">Country</label>
            <select name="country" id="country">
                <option value="Pakistan">Pakistan</option>
                <option value="USA">USA</option>
                <option value="UK">UK</option>
                <option value="Canada">Canada</option>
            </select>
        </div>    

        
    </form>

</body>

</html>
